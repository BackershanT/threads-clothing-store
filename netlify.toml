# Customer Site Configuration - Built from root using workspace
[build]
  command = "npm run build --workspace=apps/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Context for admin site deployment
[context.production]
  command = "npm run build --workspace=apps/web"
  publish = "apps/web/.next"

[context.admin]
  command = "npm run build --workspace=apps/admin"
  publish = "apps/admin/dist"
