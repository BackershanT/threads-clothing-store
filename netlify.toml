# Customer Site Configuration - Next.js
# Note: Base directory intentionally omitted to build from repo root
[build]
  command = "npm ci && npm run build --workspace=apps/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Context for admin site deployment
[context.admin]
  command = "npm ci && npm run build --workspace=apps/admin"
  publish = "apps/admin/dist"
